  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080c;
      --text: #dde1ea;
      --muted: rgba(221,225,234,0.35);
      --accent: #6366f1;
      --accent-hover: #4f52d4;
    }
    [data-theme="light"] {
      --bg: #f5f6fa;
      --text: #0f1117;
      --muted: rgba(15,17,23,0.4);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    [data-theme="dark"] .bg-layer {
      background-image: linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 10%, transparent 100%);
    }
    [data-theme="light"] .bg-layer {
      background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 10%, transparent 100%);
    }
    .bg-glow {
      position: fixed; width: 500px; height: 500px; border-radius: 50%;
      top: -160px; left: 50%; transform: translateX(-50%);
      pointer-events: none; z-index: 0;
    }
    [data-theme="dark"]  .bg-glow { background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); }
    [data-theme="light"] .bg-glow { background: radial-gradient(circle, rgba(37,99,235,0.10) 0%, transparent 70%); }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 28px;
    }
    [data-theme="dark"]  header { background: rgba(7,8,12,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    [data-theme="light"] header { background: rgba(245,246,250,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.07); }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
    }
    .nav-logo {
      width: auto; height: 44px;
      object-fit: contain; flex-shrink: 0; display: block;
    }
    /* CSS-only color switch: always load white SVG, invert in light mode */
    [data-theme="dark"]  .nav-logo { filter: none; }
    [data-theme="light"] .nav-logo { filter: invert(1); }

    .nav-name {
      font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
    }
    .nav-link {
      font-size: 12px; font-weight: 500; color: var(--muted);
      letter-spacing: 0.06em; cursor: not-allowed; user-select: none;
    }

    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 100px 20px 60px; position: relative; z-index: 1;
    }
    .hero {
      text-align: center; max-width: 420px; width: 100%;
      display: flex; flex-direction: column; align-items: center;
    }
    .hero-eyebrow {
      font-size: 10px; font-weight: 600; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 20px;
    }
    .hero-name {
      font-size: clamp(52px, 14vw, 72px); font-weight: 900;
      line-height: 0.88; letter-spacing: -0.04em;
      color: var(--text); margin-bottom: 36px;
    }
    .hero-name span { display: block; }
    [data-theme="dark"]  .hero-name .ln2 { color: transparent; -webkit-text-stroke: 1.5px rgba(221,225,234,0.3); }
    [data-theme="light"] .hero-name .ln2 { color: transparent; -webkit-text-stroke: 1.5px rgba(15,17,23,0.25); }

    .hero-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 32px; background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      border: none; border-radius: 999px; cursor: pointer;
      text-decoration: none; transition: background 0.2s, transform 0.15s;
    }
    .hero-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .hero-btn-arrow { transition: transform 0.2s; }
    .hero-btn:hover .hero-btn-arrow { transform: translateX(3px); }

    footer { position: relative; z-index: 1; margin-top: auto; }
    .footer-strip {
      position: relative;
      width: 100%;
      line-height: 0;
      /* Background: two horizontal bands matching the image colors */
      /* Top 80/130 = 61.5% celeste, rest white */
      background: linear-gradient(to bottom,
        rgb(118,170,218) 0px,
        rgb(118,170,218) 90px,
        rgb(247,255,255) 90px,
        rgb(247,255,255) 130px
      );
    }
    .footer-strip a {
      display: block;
      width: 100%;
      position: relative;
    }
    .footer-strip img {
      display: block;
      /* Never scale up beyond natural 800px, center it */
      width: min(800px, 100%);
      height: auto;
      margin: 0 auto;
      cursor: pointer;
    }
    .footer-strip a:hover .strip-tooltip { opacity: 1; }
    .strip-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,12,20,0.92);
      color: #e8eaf0;
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      backdrop-filter: blur(6px);
    }
    .strip-tooltip span { color: #93c5fd; }
    .footer-text {
      text-align: center; padding: 12px 16px;
      font-size: 10px; font-weight: 400; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.75); text-transform: uppercase;
      background: rgb(118,170,218);
    }
  </style>
</head>

  <div class="bg-glow"></div>
